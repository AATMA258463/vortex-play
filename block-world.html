<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX PLAY - Block World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#80c9f5}
#top{position:fixed;top:8px;width:100%;text-align:center;color:white;text-shadow:2px 2px 5px #222;pointer-events:none;z-index:2}
#top h2{margin:5px}
button{cursor:pointer}
#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:17px 30px;border:0;border-radius:12px;background:#1765c1;color:white;font-size:20px;font-weight:bold;z-index:5}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3;max-width:98%;overflow-x:auto}
.slot{min-width:53px;height:57px;border:3px solid #ddd;background:#222d;color:white;border-radius:7px;font-size:12px}
.slot.active{border:4px solid yellow;background:#555}
#help{position:fixed;bottom:76px;width:100%;text-align:center;color:white;text-shadow:2px 2px 4px black;font-size:12px;pointer-events:none}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:24px;text-shadow:1px 1px 3px black;pointer-events:none}
#menu{position:fixed;top:70px;right:10px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:95%}
#menu button,#craft button{padding:9px;border:0;border-radius:7px;background:#164e63;color:white;font-weight:bold}
#panel{display:none;position:fixed;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,94vw);max-height:75vh;overflow:auto;background:#17212b;color:white;border:3px solid #8bd3e6;border-radius:12px;padding:16px}
#panel h3{margin-top:0}
#items{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{background:#2e4050;border-radius:6px;padding:9px;font-size:14px}
#craft{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
#close{float:right;background:#a33!important}
#message{position:fixed;top:125px;left:50%;transform:translateX(-50%);background:#111c;color:white;padding:8px 12px;border-radius:8px;z-index:5;display:none;text-align:center}
</style>
</head>
<body>
<div id="top"><h2>🧱 BLOCK WORLD</h2><b>VORTEX PLAY</b></div>
<button id="start">PLAY WORLD</button>
<div id="cross">+</div>
<div id="help">WASD: Move | SPACE: Jump | Left click: Break | Right click: Build</div>
<div id="menu">
<button id="inventoryBtn">🎒 Inventory</button>
<button id="craftBtn">🛠️ Crafting</button>
</div>
<div id="bar"></div>
<div id="message"></div>
<div id="panel">
<button id="close">Close ✖</button>
<h3 id="panelTitle">🎒 Inventory</h3>
<div id="items"></div>
<div id="craft"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8eaff,0x596b3d,1.5));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,30,10);
sun.castShadow=true;
scene.add(sun);

function texture(base,detail,seed){
 const c=document.createElement("canvas");
 c.width=c.height=64;
 const ctx=c.getContext("2d");
 ctx.fillStyle=base;ctx.fillRect(0,0,64,64);
 let n=seed;
 for(let i=0;i<180;i++){
  n=(n*9301+49297)%233280;
  const x=(n/233280)*64;
  n=(n*9301+49297)%233280;
  const y=(n/233280)*64;
  ctx.globalAlpha=.2;
  ctx.fillStyle=detail;
  ctx.fillRect(x,y,2+n%5,2+n%5);
 }
 ctx.globalAlpha=1;
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 t.magFilter=THREE.NearestFilter;
 return t;
}
function mat(a,b,n){
 return new THREE.MeshLambertMaterial({map:texture(a,b,n)});
}
const mats={
 grass:mat("#55a83a","#b2d77a",4),
 dirt:mat("#88552f","#b47a45",7),
 stone:mat("#858585","#c2c2c2",9),
 wood:mat("#80502b","#c18a4b",12),
 leaves:mat("#238b36","#68c34a",15),
 sand:mat("#d7c17b","#fff0b0",18)
};
const cube=new THREE.BoxGeometry(1,1,1);
const blocks=[];
const blockMap=new Map();
const key=(x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blockMap.has(k))return;
 const m=new THREE.Mesh(cube,mats[type]||mats.grass);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 m.userData.type=type;
 scene.add(m);blocks.push(m);blockMap.set(k,m);
}
function removeBlock(m){
 scene.remove(m);
 const i=blocks.indexOf(m);
 if(i>=0)blocks.splice(i,1);
 blockMap.delete(key(m.position.x,m.position.y,m.position.z));
}
function heightAt(x,z){
 return Math.floor(1+Math.sin(x*.28)*1.3+Math.cos(z*.25)*1.1);
}

// World terrain
for(let x=-28;x<=28;x++){
 for(let z=-28;z<=28;z++){
  const h=heightAt(x,z);
  for(let y=-3;y<=h;y++){
   const type=y===h?(h<=0?"sand":"grass"):(y<h-2?"stone":"dirt");
   addBlock(x,y,z,type);
  }
 }
}

// Trees
function makeTree(x,z){
 const h=heightAt(x,z);
 for(let y=1;y<=4;y++)addBlock(x,h+y,z,"wood");
 for(let dx=-2;dx<=2;dx++)
  for(let dz=-2;dz<=2;dz++)
   for(let dy=3;dy<=5;dy++)
    if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)<=4)
     addBlock(x+dx,h+dy,z+dz,"leaves");
}
[[-8,-7],[8,-9],[-12,8],[12,7],[0,-13],[-16,-2],[17,1],[3,14],[-3,18],[20,-12],[-20,14]].forEach(p=>makeTree(...p));

// Lake
const water=new THREE.Mesh(
 new THREE.PlaneGeometry(10,9),
 new THREE.MeshPhongMaterial({color:0x168ed0,transparent:true,opacity:.72,shininess:90})
);
water.rotation.x=-Math.PI/2;
water.position.set(0,.18,-3);
scene.add(water);

// Clouds
const clouds=[];
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff});
for(let i=0;i<9;i++){
 const group=new THREE.Group();
 for(let j=0;j<5;j++){
  const puff=new THREE.Mesh(new THREE.BoxGeometry(2,1,2),cloudMat);
  puff.position.set((j-2)*1.2,Math.random()*.5,Math.sin(j)*.7);
  group.add(puff);
 }
 group.position.set(-25+Math.random()*50,13+Math.random()*5,-20+Math.random()*35);
 scene.add(group);clouds.push(group);
}

// Simple animals
const animals=[];
const animalMats=[
 new THREE.MeshLambertMaterial({color:0xe8e0cc}),
 new THREE.MeshLambertMaterial({color:0x8b5936}),
 new THREE.MeshLambertMaterial({color:0x333333})
];
function makeAnimal(x,z,type){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,.8,.65),animalMats[type]);
 body.position.y=.85;group.add(body);
 const head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),animalMats[type]);
 head.position.set(.75,1.05,0);group.add(head);
 for(const a of [-.4,.4])for(const b of [-.2,.2]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.6,.18),animalMats[type]);
  leg.position.set(a,.3,b);group.add(leg);
 }
 group.position.set(x,heightAt(x,z)+.1,z);
 scene.add(group);
 animals.push({group,phase:Math.random()*6});
}
makeAnimal(-4,2,0);makeAnimal(5,3,1);makeAnimal(10,-2,2);

// Player
const player=new THREE.Object3D();
player.position.set(0,heightAt(0,5)+2,5);
scene.add(player);player.add(camera);
let yaw=0,pitch=0,vy=0,grounded=false,day=0;
let selected="grass",tool="hand";
const keys={};

// Inventory counts
const inventory={grass:0,dirt:0,stone:0,wood:0,leaves:0,sand:0,apple:0};
 // SURVIVAL MODE
let health = 100;
let food = 100;

function updateSurvival(){
 const old=document.getElementById("survival");
 if(old)old.remove();

 const box=document.createElement("div");
 box.id="survival";
 box.style.cssText="position:fixed;top:105px;left:12px;z-index:4;color:white;font-weight:bold;text-shadow:2px 2px 4px black;background:#17212bcc;padding:10px;border-radius:9px;min-width:155px";
 box.innerHTML=`
 <div>❤️ Health: ${health}/100</div>
 <div style="background:#555;height:10px;border-radius:8px;margin:4px 0 10px">
 <div style="background:#e33;width:${health}%;height:10px;border-radius:8px"></div></div>
 <div>🍗 Food: ${food}/100</div>
 <div style="background:#555;height:10px;border-radius:8px;margin-top:4px">
 <div style="background:#e9b83e;width:${food}%;height:10px;border-radius:8px"></div></div>
 <button id="eatFood" style="margin-top:8px;padding:6px">🍎 Eat food</button>`;
 document.body.appendChild(box);
document.getElementById("eatFood").onclick=()=>{
  if(inventory.apple>0){
   inventory.apple--;
   food=Math.min(100,food+15);
   updateSurvival();
   updateBar();
   say("Apple eaten! Food restored.");
  }else say("No apples available!");
 };
}
updateSurvival();
const tools={axe:false,pickaxe:false,shovel:false};
const emojis={grass:"🟩",dirt:"🟫",stone:"⬜",wood:"🪵",leaves:"🍃",sand:"🟨",apple:"🍎"};
let panelMode="inventory";
 // FOOD AND HEALTH DRAIN
setInterval(() => {
  if (food > 0) {
    food = Math.max(0, food - 1);
  } else {
    health = Math.max(0, health - 2);
  }
  updateSurvival();
}, 60000);

function say(text){
 const el=document.getElementById("message");
 el.textContent=text;el.style.display="block";
 clearTimeout(say.timer);
 say.timer=setTimeout(()=>el.style.display="none",2200);
}
function updateBar(){
 const bar=document.getElementById("bar");
 bar.innerHTML="";
 ["grass","dirt","stone","wood"].forEach((type,i)=>{
  const b=document.createElement("button");
  b.className="slot"+(selected===type?" active":"");
  b.innerHTML=(i+1)+"<br>"+emojis[type]+" "+inventory[type];
  b.onclick=()=>{selected=type;updateBar();};
  bar.appendChild(b);
 });
}
function showPanel(mode){
 panelMode=mode;
 document.getElementById("panel").style.display="block";
 document.getElementById("panelTitle").textContent=
  mode==="inventory"?"🎒 Inventory":"🛠️ Crafting";
 renderPanel();
}
function renderPanel(){
 const items=document.getElementById("items");
 const craft=document.getElementById("craft");
 items.innerHTML="";
 items.innerHTML="<div class='item'>Inventory Test Working!</div>";
 craft.innerHTML="";

 if(panelMode==="inventory"){
  Object.keys(inventory).forEach(type=>{
   const d=document.createElement("div");
   d.className="item";
   d.textContent=names[type]+": "+inventory[type];
   items.appendChild(d);
  });

  Object.keys(tools).forEach(type=>{
   const d=document.createElement("div");
   d.className="item";
   d.textContent=(tools[type]?"✅ ":"🔒 ")+type+" "+(tools[type]?"crafted":"not crafted");
   items.appendChild(d);
  });

 }else{
  const recipes=[
   {name:"🪓 Craft Axe",tool:"axe",cost:{wood:3,stone:2}},
   {name:"⛏️ Craft Pickaxe",tool:"pickaxe",cost:{wood:2,stone:3}},
   {name:"🥄 Craft Shovel",tool:"shovel",cost:{wood:2,stone:1}}
  ];

  recipes.forEach(r=>{
   const b=document.createElement("button");
   const cost=Object.entries(r.cost).map(([k,v])=>names[k]+" "+v).join(" + ");
   b.textContent=r.name+" ("+cost+")";

   b.onclick=()=>{
    if(tools[r.tool]){
     say("You already crafted this tool.");
     return;
    }

    if(!Object.entries(r.cost).every(([k,v])=>inventory[k]>=v)){
     say("Not enough items! Break more blocks.");
     return;
    }

    Object.entries(r.cost).forEach(([k,v])=>inventory[k]-=v);
    tools[r.tool]=true;
    say(r.tool+" crafted!");
    renderPanel();
    updateBar();
   };

   craft.appendChild(b);
  });

  const info=document.createElement("div");
  info.className="item";
  info.textContent="Recipes use collected wood and stone. Tools are prototype items.";
  craft.appendChild(info);
 }
}

document.getElementById("inventoryBtn").onclick=()=>showPanel("inventory");
document.getElementById("craftBtn").onclick=()=>showPanel("craft");
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";

function addStartingItems(){
 inventory.wood=3;inventory.stone=2;
 updateBar();
}
addStartingItems();

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code.startsWith("Digit")){
  const i=Number(e.code.slice(5))-1;
  const type=["grass","dirt","stone","wood"][i];
  if(type){selected=type;updateBar();}
 }
 if(e.code==="Space"&&grounded){vy=.18;grounded=false;}
 if(e.code==="KeyE")showPanel("inventory");
 if(e.code==="KeyC")showPanel("craft");
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.getElementById("start").onclick=()=>{
 renderer.domElement.requestPointerLock();
};
document.addEventListener("pointerlockchange",()=>{
 document.getElementById("start").style.display=
 document.pointerLockElement===renderer.domElement?"none":"block";
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.4,Math.min(1.4,pitch));
 player.rotation.y=yaw;camera.rotation.x=pitch;
});

renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
const ray=new THREE.Raycaster();
renderer.domElement.addEventListener("mousedown",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 if(document.getElementById("panel").style.display==="block")return;
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(blocks);
 if(!hits.length||hits[0].distance>6)return;
 const hit=hits[0],block=hit.object,type=block.userData.type;
 if(e.button===0){
  // Collect the block before removing it.
  inventory[type]=(inventory[type]||0)+1;
  removeBlock(block);
  updateBar();
 }else if(e.button===2){
  if(inventory[selected]<=0){say("No "+selected+" blocks! Break blocks to collect them.");return;}
  const p=block.position.clone().add(hit.face.normal);
  const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);
  const dx=x-player.position.x,dz=z-player.position.z;
  if(Math.abs(dx)<1&&Math.abs(dz)<1&&Math.abs(y-player.position.y)<2){
   say("You cannot build inside yourself.");return;
  }
  if(!blockMap.has(key(x,y,z))){
   addBlock(x,y,z,selected);
   inventory[selected]--;
   updateBar();
  }
 }
});

function animate(){
 requestAnimationFrame(animate);
 day+=.00012;
 const daylight=Math.max(.12,(Math.sin(day)+1)/2);
 const sky=new THREE.Color().setHSL(.56,.55,.12+daylight*.42);
 scene.background.copy(sky);scene.fog.color.copy(sky);
 sun.intensity=.15+daylight*2.2;
 starsVisible(daylight);
 clouds.forEach(c=>{c.position.x+=.008;if(c.position.x>30)c.position.x=-30;});
 // Movement
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const speed=.09;
 if(keys.KeyW||keys.ArrowUp)player.position.addScaledVector(forward,speed);
 if(keys.KeyS||keys.ArrowDown)player.position.addScaledVector(forward,-speed);
 if(keys.KeyA||keys.ArrowLeft)player.position.addScaledVector(right,-speed);
 if(keys.KeyD||keys.ArrowRight)player.position.addScaledVector(right,speed);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-27,27);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-27,27);
 vy-=.007;player.position.y+=vy;
 const ground=heightAt(Math.round(player.position.x),Math.round(player.position.z))+1.7;
 if(player.position.y<=ground){player.position.y=ground;vy=0;grounded=true;}
 renderer.render(scene,camera);
}
const starGeometry=new THREE.BufferGeometry();
const positions=[];
for(let i=0;i<250;i++)positions.push((Math.random()-.5)*100,15+Math.random()*35,(Math.random()-.5)*100);
starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.25}));
scene.add(stars);
function starsVisible(daylight){stars.visible=daylight<.28;}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
