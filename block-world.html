
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VORTEX PLAY - Block World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
#top{position:fixed;top:10px;width:100%;text-align:center;color:white;text-shadow:2px 2px 5px #222;pointer-events:none;z-index:2}
#top h2{margin:5px}
#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;padding:17px 30px;border:0;border-radius:12px;background:#1765c1;color:white;font-size:20px;font-weight:bold}
#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
.slot{width:54px;height:54px;border:3px solid #ddd;background:#222b;color:white;font-size:12px;border-radius:7px}
.slot.active{border:4px solid yellow;background:#555}
#help{position:fixed;bottom:82px;width:100%;text-align:center;color:white;text-shadow:2px 2px 4px black;font-size:13px;pointer-events:none}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:24px;text-shadow:1px 1px 3px black;pointer-events:none}
</style>
</head>
<body>
<div id="top"><h2>🧱 BLOCK WORLD</h2><b>VORTEX PLAY</b></div>
<button id="start">PLAY WORLD</button>
<div id="cross">+</div>
<div id="help">WASD: Move | SPACE: Jump | Left click: Break | Right click: Build | 1-4: Select block</div>
<div id="bar">
<button class="slot active" data-type="grass">1<br>🟩</button>
<button class="slot" data-type="dirt">2<br>🟫</button>
<button class="slot" data-type="stone">3<br>⬜</button>
<button class="slot" data-type="wood">4<br>🪵</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,20,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const skyLight=new THREE.HemisphereLight(0xbde7ff,0x52633c,1.5);
scene.add(skyLight);
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,25,10);
sun.castShadow=true;
scene.add(sun);

const mats={
 grass:new THREE.MeshLambertMaterial({color:0x50ad38}),
 dirt:new THREE.MeshLambertMaterial({color:0x936037}),
 stone:new THREE.MeshLambertMaterial({color:0x888888}),
 wood:new THREE.MeshLambertMaterial({color:0x80502b}),
 leaves:new THREE.MeshLambertMaterial({color:0x238b36}),
 sand:new THREE.MeshLambertMaterial({color:0xd9c27a})
};
const geo=new THREE.BoxGeometry(1,1,1);
const blocks=[];
const worldMap=new Map();
const mapKey=(x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,type){
 const key=mapKey(x,y,z);
 if(worldMap.has(key))return;
 const m=new THREE.Mesh(geo,mats[type]||mats.grass);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 m.userData.type=type;
 scene.add(m);
 blocks.push(m);
 worldMap.set(key,m);
}
function removeBlock(m){
 scene.remove(m);
 blocks.splice(blocks.indexOf(m),1);
 worldMap.delete(mapKey(m.position.x,m.position.y,m.position.z));
}

// Rolling hills
function heightAt(x,z){
 return Math.floor(1.5+Math.sin(x*.35)*1.2+Math.cos(z*.3)*1.1);
}
for(let x=-22;x<=22;x++){
 for(let z=-22;z<=22;z++){
  const h=heightAt(x,z);
  for(let y=-2;y<=h;y++){
   addBlock(x,y,z,y===h?(h<=0?"sand":"grass"):y<h-2?"stone":"dirt");
  }
 }
}

// Trees
function tree(x,z){
 const h=heightAt(x,z);
 for(let y=1;y<=4;y++)addBlock(x,h+y,z,"wood");
 for(let dx=-2;dx<=2;dx++){
  for(let dz=-2;dz<=2;dz++){
   for(let dy=3;dy<=5;dy++){
    if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)<=4)
     addBlock(x+dx,h+dy,z+dz,"leaves");
   }
  }
 }
}
[[-8,-7],[8,-9],[-12,8],[12,7],[0,-13],[-16,-2],[17,1],[3,14]].forEach(p=>tree(p[0],p[1]));

// Distant mountain shapes
const mountainMat=new THREE.MeshLambertMaterial({color:0x71818d});
for(let i=0;i<12;i++){
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(3+Math.random()*3,7+Math.random()*7,5),
  mountainMat
 );
 mountain.position.set(-25+i*5,3,-28);
 scene.add(mountain);
}

// Stars
const starGeo=new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<250;i++){
 starPositions.push((Math.random()-.5)*100,15+Math.random()*35,(Math.random()-.5)*100);
}
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.25}));
scene.add(stars);

// Player
const player=new THREE.Object3D();
player.position.set(0,heightAt(0,5)+2,5);
scene.add(player);
player.add(camera);
let yaw=0,pitch=0,vy=0,grounded=false;
const keys={};
let selected="grass";
let day=0;

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code.startsWith("Digit")){
  const slot=document.querySelectorAll(".slot")[Number(e.code.slice(5))-1];
  if(slot)slot.click();
 }
 if(e.code==="Space"&&grounded){vy=.18;grounded=false;}
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.querySelectorAll(".slot").forEach(slot=>{
 slot.onclick=()=>{
  selected=slot.dataset.type;
  document.querySelectorAll(".slot").forEach(s=>s.classList.remove("active"));
  slot.classList.add("active");
 };
});

document.getElementById("start").onclick=()=>{
 renderer.domElement.requestPointerLock();
};
document.addEventListener("pointerlockchange",()=>{
 document.getElementById("start").style.display=
 document.pointerLockElement===renderer.domElement?"none":"block";
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.4,Math.min(1.4,pitch));
 player.rotation.y=yaw;
 camera.rotation.x=pitch;
});

renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
const ray=new THREE.Raycaster();
renderer.domElement.addEventListener("mousedown",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(blocks);
 if(!hits.length||hits[0].distance>6)return;
 const hit=hits[0];
 if(e.button===0)removeBlock(hit.object);
 if(e.button===2){
  const p=hit.object.position.clone().add(hit.face.normal);
  addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected);
 }
});

function animate(){
 requestAnimationFrame(animate);

 // Smooth day and night cycle
 day+=.00012;
 const sunHeight=Math.sin(day);
 const daylight=Math.max(.12,(sunHeight+1)/2);
 const skyColor=new THREE.Color().setHSL(.55,.55,.12+daylight*.42);
 scene.background.copy(skyColor);
 scene.fog.color.copy(skyColor);
 sun.intensity=.15+daylight*2.2;
 skyLight.intensity=.35+daylight*1.3;
 sun.position.set(Math.cos(day)*30,sunHeight*35,10);
 stars.visible=daylight<.28;

 // Movement
 const speed=.105;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 if(keys.KeyW)player.position.addScaledVector(forward,speed);
 if(keys.KeyS)player.position.addScaledVector(forward,-speed);
 if(keys.KeyA)player.position.addScaledVector(right,-speed);
 if(keys.KeyD)player.position.addScaledVector(right,speed);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-21,21);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-21,21);

 vy-=.007;
 player.position.y+=vy;
 const ground=heightAt(Math.round(player.position.x),Math.round(player.position.z))+1.7;
 if(player.position.y<=ground){
  player.position.y=ground;vy=0;grounded=true;
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
