
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX PLAY - Block World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#80c9f5}
#top{position:fixed;top:8px;width:100%;text-align:center;color:white;text-shadow:2px 2px 5px #222;pointer-events:none;z-index:2}
#top h2{margin:5px}
#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:17px 30px;border:0;border-radius:12px;background:#1765c1;color:white;font-size:20px;font-weight:bold;z-index:5}
#bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
.slot{width:55px;height:55px;border:3px solid #ddd;background:#222b;color:white;border-radius:7px;font-size:12px}
.slot.active{border:4px solid yellow;background:#555}
#help{position:fixed;bottom:78px;width:100%;text-align:center;color:white;text-shadow:2px 2px 4px black;font-size:12px;pointer-events:none}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:24px;text-shadow:1px 1px 3px black;pointer-events:none}
</style>
</head>
<body>
<div id="top"><h2>🧱 BLOCK WORLD</h2><b>VORTEX PLAY</b></div>
<button id="start">PLAY WORLD</button>
<div id="cross">+</div>
<div id="help">WASD: Move | SPACE: Jump | Left click: Break | Right click: Build | 1-4: Select</div>
<div id="bar">
<button class="slot active" data-type="grass">1<br>🟩</button>
<button class="slot" data-type="dirt">2<br>🟫</button>
<button class="slot" data-type="stone">3<br>⬜</button>
<button class="slot" data-type="wood">4<br>🪵</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,25,75);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xc8eaff,0x596b3d,1.5);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,30,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function texture(base,detail,seed){
 const c=document.createElement("canvas");
 c.width=c.height=128;
 const ctx=c.getContext("2d");
 ctx.fillStyle=base;ctx.fillRect(0,0,128,128);
 let n=seed;
 for(let i=0;i<500;i++){
  n=(n*9301+49297)%233280;
  const x=(n/233280)*128;
  n=(n*9301+49297)%233280;
  const y=(n/233280)*128;
  const size=2+(n%7);
  ctx.globalAlpha=.18+(n%30)/100;
  ctx.fillStyle=detail;
  ctx.fillRect(x,y,size,size);
 }
 ctx.globalAlpha=1;
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 t.magFilter=THREE.NearestFilter;
 t.minFilter=THREE.NearestMipmapNearestFilter;
 return t;
}
function material(base,detail,seed){
 return new THREE.MeshLambertMaterial({map:texture(base,detail,seed)});
}
const mats={
 grass:material("#55a83a","#b2d77a",4),
 dirt:material("#88552f","#b47a45",7),
 stone:material("#858585","#c2c2c2",9),
 wood:material("#80502b","#c18a4b",12),
 leaves:material("#238b36","#68c34a",15),
 sand:material("#d7c17b","#fff0b0",18)
};
const cube=new THREE.BoxGeometry(1,1,1);
const blocks=[];
const blockMap=new Map();
const key=(x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blockMap.has(k))return;
 const m=new THREE.Mesh(cube,mats[type]||mats.grass);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 m.userData.type=type;
 scene.add(m);
 blocks.push(m);
 blockMap.set(k,m);
}
function removeBlock(m){
 scene.remove(m);
 blocks.splice(blocks.indexOf(m),1);
 blockMap.delete(key(m.position.x,m.position.y,m.position.z));
}
function heightAt(x,z){
 return Math.floor(1+Math.sin(x*.28)*1.3+Math.cos(z*.25)*1.1);
}

// Hills and ground
for(let x=-22;x<=22;x++){
 for(let z=-22;z<=22;z++){
  const h=heightAt(x,z);
  for(let y=-3;y<=h;y++){
   let type=y===h?(h<=0?"sand":"grass"):(y<h-2?"stone":"dirt");
   addBlock(x,y,z,type);
  }
 }
}

// Trees
function makeTree(x,z){
 const h=heightAt(x,z);
 for(let y=1;y<=4;y++)addBlock(x,h+y,z,"wood");
 for(let dx=-2;dx<=2;dx++){
  for(let dz=-2;dz<=2;dz++){
   for(let dy=3;dy<=5;dy++){
    if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)<=4)
     addBlock(x+dx,h+dy,z+dz,"leaves");
   }
  }
 }
}
[[-8,-7],[8,-9],[-12,8],[12,7],[0,-13],[-16,-2],[17,1],[3,14],[-3,18]].forEach(p=>makeTree(...p));

// Water lake
const waterMat=new THREE.MeshPhongMaterial({
 color:0x168ed0,transparent:true,opacity:.78,
 shininess:100
});
const water=new THREE.Mesh(new THREE.PlaneGeometry(10,9),waterMat);
water.rotation.x=-Math.PI/2;
water.position.set(0,.18,-3);
scene.add(water);

// Clouds
const clouds=[];
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff});
for(let i=0;i<9;i++){
 const group=new THREE.Group();
 for(let j=0;j<5;j++){
  const puff=new THREE.Mesh(new THREE.BoxGeometry(2,1,2),cloudMat);
  puff.position.set((j-2)*1.2,Math.random()*.5,Math.sin(j)*.7);
  group.add(puff);
 }
 group.position.set(-25+Math.random()*50,13+Math.random()*5,-20+Math.random()*35);
 scene.add(group);
 clouds.push(group);
}

// Simple blocky animals
const animals=[];
const animalMats=[
 new THREE.MeshLambertMaterial({color:0xe8e0cc}),
 new THREE.MeshLambertMaterial({color:0x8b5936}),
 new THREE.MeshLambertMaterial({color:0x333333})
];
function makeAnimal(x,z,index){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,.8,.65),animalMats[index]);
 body.position.y=.85;group.add(body);
 const head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),animalMats[index]);
 head.position.set(.75,1.05,0);group.add(head);
 for(let a of [-.4,.4]){
  for(let b of [-.2,.2]){
   const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.6,.18),animalMats[index]);
   leg.position.set(a,.3,b);group.add(leg);
  }
 }
 group.position.set(x,heightAt(x,z)+.1,z);
 scene.add(group);
 animals.push({group,x,z,phase:Math.random()*6});
}
makeAnimal(-4,2,0);
makeAnimal(5,3,1);
makeAnimal(10,-2,2);

// Mountains in distance
const mountainMat=new THREE.MeshLambertMaterial({color:0x788b99});
for(let i=0;i<13;i++){
 const m=new THREE.Mesh(new THREE.ConeGeometry(4,10,5),mountainMat);
 m.position.set(-30+i*5,4,-30);
 scene.add(m);
}

// Stars
const starGeometry=new THREE.BufferGeometry();
const positions=[];
for(let i=0;i<250;i++){
 positions.push((Math.random()-.5)*100,15+Math.random()*35,(Math.random()-.5)*100);
}
starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.25}));
scene.add(stars);

// Player
const player=new THREE.Object3D();
player.position.set(0,heightAt(0,5)+2,5);
scene.add(player);
player.add(camera);
let yaw=0,pitch=0,vy=0,grounded=false,selected="grass",day=0;
const keys={};

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code.startsWith("Digit")){
  const s=document.querySelectorAll(".slot")[Number(e.code.slice(5))-1];
  if(s)s.click();
 }
 if(e.code==="Space"&&grounded){vy=.18;grounded=false;}
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.querySelectorAll(".slot").forEach(s=>{
 s.onclick=()=>{
  selected=s.dataset.type;
  document.querySelectorAll(".slot").forEach(b=>b.classList.remove("active"));
  s.classList.add("active");
 };
});

document.getElementById("start").onclick=()=>{
 renderer.domElement.requestPointerLock();
};
document.addEventListener("pointerlockchange",()=>{
 document.getElementById("start").style.display=
 document.pointerLockElement===renderer.domElement?"none":"block";
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.4,Math.min(1.4,pitch));
 player.rotation.y=yaw;
 camera.rotation.x=pitch;
});

renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
const ray=new THREE.Raycaster();
renderer.domElement.addEventListener("mousedown",e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(blocks);
 if(!hits.length||hits[0].distance>6)return;
 const hit=hits[0];
 if(e.button===0)removeBlock(hit.object);
 if(e.button===2){
  const p=hit.object.position.clone().add(hit.face.normal);
  addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected);
 }
});

function animate(){
 requestAnimationFrame(animate);
 day+=.00012;
 const daylight=Math.max(.12,(Math.sin(day)+1)/2);
 const sky=new THREE.Color().setHSL(.56,.55,.12+daylight*.42);
 scene.background.copy(sky);
 scene.fog.color.copy(sky);
 sun.intensity=.15+daylight*2.2;
 hemi.intensity=.35+daylight*1.3;
 sun.position.set(Math.cos(day)*30,Math.sin(day)*35,10);
 stars.visible=daylight<.28;

 clouds.forEach(c=>{
  c.position.x+=.008;
  if(c.position.x>30)c.position.x=-30;
 });
 animals.forEach(a=>{
  a.phase+=.012;
  a.group.position.x=a.x+Math.sin(a.phase)*1.5;
  a.group.position.z=a.z+Math.cos(a.phase)*1.5;
  a.group.rotation.y=Math.sin(a.phase)*.5;
 });

 water.position.y=.18+Math.sin(performance.now()*.001)*.025;

 const speed=.105;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 if(keys.KeyW)player.position.addScaledVector(forward,speed);
 if(keys.KeyS)player.position.addScaledVector(forward,-speed);
 if(keys.KeyA)player.position.addScaledVector(right,-speed);
 if(keys.KeyD)player.position.addScaledVector(right,speed);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-21,21);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-21,21);
 vy-=.007;
 player.position.y+=vy;
 const ground=heightAt(Math.round(player.position.x),Math.round(player.position.z))+1.7;
 if(player.position.y<=ground){
  player.position.y=ground;vy=0;grounded=true;
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
