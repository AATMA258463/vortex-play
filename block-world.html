
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World - VORTEX PLAY</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
  }
  #info {
    position: fixed;
    top: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 4px black;
    z-index: 2;
    pointer-events: none;
  }
  #start {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 25px;
    font-size: 18px;
    background: #1765c1;
    color: white;
    border: 0;
    border-radius: 10px;
    z-index: 5;
    cursor: pointer;
  }
  #help {
    position: fixed;
    bottom: 12px;
    width: 100%;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 4px black;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="info">
  <h2>🧱 BLOCK WORLD</h2>
  <p>VORTEX PLAY</p>
</div>

<button id="start">PLAY WORLD</button>

<div id="help">
  WASD: Move | SPACE: Jump | Left Click: Break | Right Click: Place
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 45);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 100
);

camera.position.set(0, 3, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x668855, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
scene.add(sun);

const materials = {
  grass: new THREE.MeshLambertMaterial({ color: 0x45ad42 }),
  dirt: new THREE.MeshLambertMaterial({ color: 0x946037 }),
  stone: new THREE.MeshLambertMaterial({ color: 0x888888 }),
  wood: new THREE.MeshLambertMaterial({ color: 0x80502b }),
  leaves: new THREE.MeshLambertMaterial({ color: 0x238b36 })
};

const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = [];

function addBlock(x, y, z, type) {
  const block = new THREE.Mesh(cubeGeometry, materials[type]);
  block.position.set(x, y, z);
  block.userData.type = type;
  scene.add(block);
  blocks.push(block);
}

for (let x = -10; x <= 10; x++) {
  for (let z = -10; z <= 10; z++) {
    addBlock(x, 0, z, "grass");
    addBlock(x, -1, z, "dirt");
  }
}

// Trees
function makeTree(x, z) {
  for (let y = 1; y <= 3; y++) {
    addBlock(x, y, z, "wood");
  }
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      for (let y = 3; y <= 4; y++) {
        addBlock(x + dx, y, z + dz, "leaves");
      }
    }
  }
}

makeTree(-5, -4);
makeTree(5, -5);
makeTree(-6, 5);
makeTree(6, 5);

// Player
const player = new THREE.Object3D();
player.position.set(0, 1.7, 5);
scene.add(player);
player.add(camera);

let yaw = 0;
let pitch = 0;
let verticalSpeed = 0;
let grounded = true;
const keys = {};

document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space" && grounded) {
    verticalSpeed = 0.16;
    grounded = false;
  }
});

document.addEventListener("keyup", e => {
  keys[e.code] = false;
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement === renderer.domElement) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
    player.rotation.y = yaw;
    camera.rotation.x = pitch;
  }
});

document.getElementById("start").onclick = () => {
  renderer.domElement.requestPointerLock();
  document.getElementById("start").style.display = "none";
};

document.addEventListener("pointerlockchange", () => {
  if (document.pointerLockElement !== renderer.domElement) {
    document.getElementById("start").style.display = "block";
  }
});

const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

renderer.domElement.addEventListener("mousedown", e => {
  if (document.pointerLockElement !== renderer.domElement) return;

  raycaster.setFromCamera(center, camera);
  const hits = raycaster.intersectObjects(blocks);

  if (!hits.length || hits[0].distance > 6) return;

  const hit = hits[0];

  if (e.button === 0) {
    scene.remove(hit.object);
    blocks.splice(blocks.indexOf(hit.object), 1);
  }

  if (e.button === 2) {
    const position = hit.object.position.clone()
      .add(hit.face.normal);
    addBlock(
      Math.round(position.x),
      Math.round(position.y),
      Math.round(position.z),
      "grass"
    );
  }
});

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.09;
  const forward = new THREE.Vector3(
    -Math.sin(yaw), 0, -Math.cos(yaw)
  );
  const right = new THREE.Vector3(
    Math.cos(yaw), 0, -Math.sin(yaw)
  );

  if (keys["KeyW"]) player.position.addScaledVector(forward, speed);
  if (keys["KeyS"]) player.position.addScaledVector(forward, -speed);
  if (keys["KeyA"]) player.position.addScaledVector(right, -speed);
  if (keys["KeyD"]) player.position.addScaledVector(right, speed);

  player.position.x = THREE.MathUtils.clamp(player.position.x, -10, 10);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -10, 10);

  verticalSpeed -= 0.006;
  player.position.y += verticalSpeed;

  if (player.position.y <= 1.7) {
    player.position.y = 1.7;
    verticalSpeed = 0;
    grounded = true;
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
